{{ define "main" }}
<div class="gallery-single-container">
  <!-- Back Button -->
  <nav class="gallery-nav">
    <a href="{{ .Parent.RelPermalink }}" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
      Back to Gallery
    </a>
  </nav>

  <!-- Header -->
  <header class="gallery-single-header">
    <h1 class="gallery-single-title">{{ .Title }}</h1>
    {{ if .Description }}
    <p class="gallery-single-description">{{ .Description }}</p>
    {{ end }}
  </header>

  <!-- Photo Grid -->
  {{ partial "gallery.html" . }}
</div>

<!-- PhotoSwipe -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.3.4/dist/photoswipe.css" />
<script src="https://cdn.jsdelivr.net/npm/lazysizes@5.3.2/lazysizes.min.js" async></script>
<script type="module">
  import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5.3.4/dist/photoswipe-lightbox.esm.js';
  import PhotoSwipe from 'https://cdn.jsdelivr.net/npm/photoswipe@5.3.4/dist/photoswipe.esm.js';

  function initPhotoSwipe() {
    const gallery = document.getElementById('gallery');
    if (!gallery) {
      console.error('Gallery container not found');
      return;
    }

    const galleryItems = gallery.querySelectorAll('a.gallery-item');
    if (galleryItems.length === 0) {
      console.error('No gallery items found');
      return;
    }

    console.log('Initializing PhotoSwipe with', galleryItems.length, 'items');

    // Build image data array with titles
    const items = Array.from(galleryItems).map(item => {
      const src = item.getAttribute('data-pswp-src') || item.href;
      const width = parseInt(item.getAttribute('data-pswp-width')) || 1600;
      const height = parseInt(item.getAttribute('data-pswp-height')) || 1200;
      const title = item.getAttribute('data-title') || '';
      
      return {
        src: src,
        width: width,
        height: height,
        title: title
      };
    });

    // Create lightbox instance
    const lightbox = new PhotoSwipeLightbox({
      dataSource: items,
      pswpModule: PhotoSwipe,
      showHideAnimationType: 'fade',
      bgOpacity: 0.95,
      closeTitle: 'Close (Esc)',
      zoomTitle: 'Zoom in/out',
      arrowPrevTitle: 'Previous (arrow left)',
      arrowNextTitle: 'Next (arrow right)',
      returnFocus: true,
      tapToClose: true,
      swipeToClose: true,
      zoom: false,
      initialZoomFactor: 1,
      secondaryZoomLevel: 1,
      maxZoomLevel: 1,
      speed: 300,
      pinchToClose: false,
      // Add caption plugin
      padding: { top: 20, bottom: 60, left: 20, right: 20 }
    });

    // Add caption rendering
    lightbox.on('itemData', (e) => {
      const { itemData } = e;
      if (itemData.title) {
        itemData.html = `
          <div class="pswp__custom-content">
            <img src="${itemData.src}" alt="${itemData.title}" style="max-width: 100%; max-height: 85vh; object-fit: contain;">
            ${itemData.title ? `<div class="pswp__caption">${itemData.title}</div>` : ''}
          </div>
        `;
      }
    });

    // Initialize lightbox
    lightbox.init();

    // Bind click events
    galleryItems.forEach((item, index) => {
      item.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        console.log('Opening photo at index:', index);
        lightbox.loadAndOpen(index);
        return false;
      });
    });

    console.log('PhotoSwipe initialized successfully');
  }

  // Wait for DOM to be ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(initPhotoSwipe, 100);
    });
  } else {
    setTimeout(initPhotoSwipe, 100);
  }
</script>

<style>
.gallery-single-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.5rem;
}

/* Navigation */
.gallery-nav {
  margin-bottom: 1.5rem;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--link-color, #1565c0);
  text-decoration: none;
  font-weight: 500;
  padding: 0.5rem 0;
  transition: color 0.2s ease;
}

.back-link:hover {
  color: var(--link-hover-color, #0d47a1);
}

.back-link svg {
  transition: transform 0.2s ease;
}

.back-link:hover svg {
  transform: translateX(-4px);
}

/* Header */
.gallery-single-header {
  text-align: center;
  margin-bottom: 2.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border-color, #e0e0e0);
}

.gallery-single-title {
  font-size: 2rem;
  font-weight: 700;
  margin: 0 0 0.75rem 0;
  color: var(--heading-color, #333);
}

.gallery-single-description {
  font-size: 1.1rem;
  line-height: 1.6;
  color: var(--text-color, #666);
  max-width: 600px;
  margin: 0 auto;
}

/* PhotoSwipe Custom Caption */
.pswp__custom-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
}

.pswp__caption {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.7);
  color: #fff;
  padding: 0.75rem 1.5rem;
  border-radius: 8px;
  font-size: 0.95rem;
  max-width: 80%;
  text-align: center;
  backdrop-filter: blur(4px);
}

/* Responsive */
@media (max-width: 768px) {
  .gallery-single-container {
    padding: 1rem;
  }
  
  .gallery-single-title {
    font-size: 1.5rem;
  }
  
  .gallery-single-description {
    font-size: 1rem;
  }
  
  .pswp__caption {
    font-size: 0.85rem;
    padding: 0.5rem 1rem;
    max-width: 90%;
  }
}
</style>
{{ end }}

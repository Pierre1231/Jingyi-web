{{ define "main" }}
<div class="gallery-single-container">
  <!-- Back Button -->
  <nav class="gallery-nav">
    <a href="{{ .Parent.RelPermalink }}" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
      Back to Gallery
    </a>
  </nav>

  <!-- Header -->
  <header class="gallery-single-header">
    <h1 class="gallery-single-title">{{ .Title }}</h1>
    {{ if .Description }}
    <p class="gallery-single-description">{{ .Description }}</p>
    {{ end }}
  </header>

  <!-- Photo Grid -->
  {{ partial "gallery.html" . }}
</div>

<!-- PhotoSwipe CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.3.4/dist/photoswipe.css" />

<!-- PhotoSwipe -->
<script type="module">
  import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5.3.4/dist/photoswipe-lightbox.esm.js';
  import PhotoSwipe from 'https://cdn.jsdelivr.net/npm/photoswipe@5.3.4/dist/photoswipe.esm.js';

  const gallery = document.getElementById('gallery');
  if (!gallery) {
    console.error('Gallery container not found');
  } else {
    const galleryItems = gallery.querySelectorAll('a.masonry-item');
    
    if (galleryItems.length === 0) {
      console.error('No gallery items found');
    } else {
      // Build items array
      const items = Array.from(galleryItems).map(item => ({
        src: item.getAttribute('data-pswp-src') || item.href,
        width: parseInt(item.getAttribute('data-pswp-width')) || 1600,
        height: parseInt(item.getAttribute('data-pswp-height')) || 1200
      }));

      // Create lightbox with full controls
      const lightbox = new PhotoSwipeLightbox({
        dataSource: items,
        pswpModule: PhotoSwipe,
        
        // Animation
        showHideAnimationType: 'fade',
        speed: 300,
        
        // Background
        bgOpacity: 0.95,
        
        // UI Elements
        closeTitle: 'Close (Esc)',
        zoomTitle: 'Zoom',
        arrowPrevTitle: 'Previous (Left arrow)',
        arrowNextTitle: 'Next (Right arrow)',
        
        // Enable all controls
        close: true,
        arrows: true,
        counter: true,
        
        // Interaction
        returnFocus: true,
        tapToClose: true,
        swipeToClose: true,
        
        // Disable zoom (clean viewing)
        zoom: false,
        initialZoomFactor: 1,
        maxZoomLevel: 1,
        
        // Padding around image
        padding: { top: 20, bottom: 20, left: 20, right: 20 }
      });

      // Initialize
      lightbox.init();

      // Bind clicks
      galleryItems.forEach((item, index) => {
        item.addEventListener('click', (e) => {
          e.preventDefault();
          lightbox.loadAndOpen(index);
        });
      });

      console.log('PhotoSwipe initialized with', items.length, 'images');
    }
  }
</script>

<style>
.gallery-single-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.5rem;
}

.gallery-nav {
  margin-bottom: 1.5rem;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--link-color, #1565c0);
  text-decoration: none;
  font-weight: 500;
  padding: 0.5rem 0;
  transition: color 0.2s ease;
}

.back-link:hover {
  color: var(--link-hover-color, #0d47a1);
}

.back-link svg {
  transition: transform 0.2s ease;
}

.back-link:hover svg {
  transform: translateX(-4px);
}

.gallery-single-header {
  text-align: center;
  margin-bottom: 2rem;
}

.gallery-single-title {
  font-size: 2rem;
  font-weight: 300;
  margin: 0 0 0.5rem 0;
  color: var(--heading-color, #333);
}

.gallery-single-description {
  font-size: 1.1rem;
  line-height: 1.6;
  color: var(--text-color, #666);
  max-width: 600px;
  margin: 0 auto;
}

@media (max-width: 768px) {
  .gallery-single-container {
    padding: 1rem;
  }
  
  .gallery-single-title {
    font-size: 1.5rem;
  }
}
</style>
{{ end }}

{{ define "main" }}
<div class="gallery-single-container">
  <!-- Back Button -->
  <nav class="gallery-nav">
    <a href="{{ .Parent.RelPermalink }}" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
      <span>Back to Gallery</span>
    </a>
  </nav>

  <!-- Header -->
  <header class="gallery-single-header">
    <h1 class="gallery-single-title">{{ .Title }}</h1>
    {{ if .Description }}
    <p class="gallery-single-description">{{ .Description }}</p>
    {{ end }}
    <div class="header-divider"></div>
  </header>

  <!-- Photo Grid -->
  {{ partial "gallery.html" . }}
</div>

<!-- PhotoSwipe CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.3.4/dist/photoswipe.css" />

<!-- PhotoSwipe -->
<script type="module">
  import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5.3.4/dist/photoswipe-lightbox.esm.js';
  import PhotoSwipe from 'https://cdn.jsdelivr.net/npm/photoswipe@5.3.4/dist/photoswipe.esm.js';

  const gallery = document.getElementById('gallery');
  if (!gallery) {
    console.error('Gallery container not found');
  } else {
    const galleryItems = gallery.querySelectorAll('a.masonry-item');
    
    if (galleryItems.length === 0) {
      console.error('No gallery items found');
    } else {
      // Build items array
      const items = Array.from(galleryItems).map(item => ({
        src: item.getAttribute('data-pswp-src') || item.href,
        width: parseInt(item.getAttribute('data-pswp-width')) || 1600,
        height: parseInt(item.getAttribute('data-pswp-height')) || 1200
      }));

      // Create lightbox - hide arrows but keep keyboard navigation
      const lightbox = new PhotoSwipeLightbox({
        dataSource: items,
        pswpModule: PhotoSwipe,
        
        // Animation
        showHideAnimationType: 'fade',
        speed: 300,
        
        // Background
        bgOpacity: 0.97,
        
        // UI Elements
        closeTitle: 'Close (Esc)',
        zoomTitle: 'Zoom',
        arrowPrevTitle: 'Previous (←)',
        arrowNextTitle: 'Next (→)',
        
        // Controls - hide arrows, keep close and counter
        close: true,
        arrows: false,
        counter: true,
        
        // Interaction - keep keyboard and swipe
        returnFocus: true,
        tapToClose: true,
        swipeToClose: true,
        
        // Enable zoom for detailed viewing
        zoom: true,
        initialZoomLevel: 'fit',
        secondaryZoomLevel: 2,
        maxZoomLevel: 4,
        
        // Padding around image
        padding: { top: 20, bottom: 40, left: 20, right: 20 }
      });

      // Initialize
      lightbox.init();

      // Bind clicks
      galleryItems.forEach((item, index) => {
        item.addEventListener('click', (e) => {
          e.preventDefault();
          lightbox.loadAndOpen(index);
        });
      });

      console.log('PhotoSwipe initialized with', items.length, 'images');
    }
  }
</script>

<style>
.gallery-single-container {
  max-width: 1600px;
  margin: 0 auto;
  padding: 2rem 1rem;
  background: #0a0a0a;
  min-height: 100vh;
}

.gallery-nav {
  margin-bottom: 2rem;
  padding: 0 0.5rem;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  color: #888;
  text-decoration: none;
  font-weight: 400;
  font-size: 0.9rem;
  letter-spacing: 0.05em;
  padding: 0.5rem 0;
  transition: color 0.3s ease;
}

.back-link:hover {
  color: #fff;
}

.back-link svg {
  transition: transform 0.3s ease;
}

.back-link:hover svg {
  transform: translateX(-4px);
}

.gallery-single-header {
  text-align: center;
  margin-bottom: 3rem;
  padding: 0 1rem;
}

.gallery-single-title {
  font-size: 2.5rem;
  font-weight: 300;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin: 0 0 1rem 0;
  color: #ffffff;
  font-family: 'Helvetica Neue', Arial, sans-serif;
}

.gallery-single-description {
  font-size: 1rem;
  line-height: 1.8;
  color: #777;
  max-width: 600px;
  margin: 0 auto 1.5rem;
  font-weight: 300;
}

.header-divider {
  width: 40px;
  height: 1px;
  background: #444;
  margin: 0 auto;
}

@media (max-width: 768px) {
  .gallery-single-container {
    padding: 1.5rem 0.5rem;
  }
  
  .gallery-single-title {
    font-size: 1.75rem;
    letter-spacing: 0.08em;
  }
  
  .gallery-single-description {
    font-size: 0.9rem;
  }
}

/* PhotoSwipe Custom Styles - Make buttons visible on dark background */
.pswp {
  --pswp-icon-color: #fff;
  --pswp-icon-color-secondary: #ccc;
  --pswp-icon-stroke-color: #000;
  --pswp-icon-stroke-width: 2px;
}

.pswp__button {
  opacity: 0.9;
  transition: opacity 0.2s ease;
}

.pswp__button:hover {
  opacity: 1;
}

/* Close button */
.pswp__button--close {
  background: rgba(255, 255, 255, 0.15) !important;
  border-radius: 50%;
  width: 44px;
  height: 44px;
  margin: 10px;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}

.pswp__button--close:hover {
  background: rgba(255, 255, 255, 0.3) !important;
}

/* Close button icon positioning */
.pswp__button--close .pswp__icn {
  fill: #fff;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 24px;
  height: 24px;
}

/* Hide navigation arrows but keep keyboard navigation */
.pswp__button--arrow {
  display: none !important;
}

/* Counter */
.pswp__counter {
  color: #fff;
  font-size: 15px;
  font-weight: 400;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  padding: 10px 15px;
}
</style>
{{ end }}

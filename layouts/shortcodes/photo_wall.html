{{- $album := .Get "images" | default "photography" -}}
{{- $photoFiles := slice "1.JPG" "2.jpg" "3.jpg" "4.jpg" "5.jpg" "6.jpg" "7.jpg" "8.jpg" "9.jpg" -}}

<div class="photo-wall-container">
  <div class="photo-wall-grid">
    {{- range $photoFiles -}}
      {{- $imgPath := printf "/media/albums/%s/%s" $album . -}}
      <div class="photo-wall-item">
        <img src="{{ $imgPath }}" alt="Photography" loading="lazy" />
      </div>
    {{- end -}}
  </div>
</div>

<style>
.photo-wall-container {
  margin: 2rem 0;
}

.photo-wall-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
}

.photo-wall-item {
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 8px;
  background: #f0f0f0;
}

.photo-wall-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.photo-wall-item:hover img {
  transform: scale(1.05);
}

@media (max-width: 768px) {
  .photo-wall-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
  }
}

@media (max-width: 480px) {
  .photo-wall-grid {
    grid-template-columns: 1fr;
  }
}
</style>
